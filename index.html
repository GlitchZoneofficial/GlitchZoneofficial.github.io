<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GlitchZone Community</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Inter:wght@400;500;600&display=swap">
<style>
:root{--bg:#101114;--sf:#17181d;--sf2:#1e2027;--bd:#272a33;--tx:#e6e7ec;--mu:#8d92a3;--ac:#8b6cf0;--ac2:#a48df5;--mint:#6fe3cb;--pink:#b45ac8;--er:#ef6b6b;--ok:#4ecb9a;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:64px}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--ac2)}svg{flex:none;display:block}
.wrap{max-width:1080px;margin:auto;padding:0 16px}
header{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--bd)}
.bar{display:flex;align-items:center;gap:6px;height:54px;position:relative}
.logo{font:700 21px Cinzel,"Trajan Pro",Georgia,serif;color:var(--mint);text-shadow:1.5px 1px 0 var(--pink);cursor:pointer;white-space:nowrap;margin-right:10px}
nav{display:flex;gap:2px;align-items:center}
nav button{background:none;border:0;padding:7px 11px;border-radius:6px;cursor:pointer;color:var(--mu);font-weight:500}
nav button:hover,nav button.on{color:var(--tx)}nav button.on{background:var(--sf2)}
.sp{flex:1}
.ib{background:none;border:1px solid transparent;border-radius:8px;width:38px;height:38px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--mu);position:relative;flex:none}
.ib:hover{color:var(--tx);background:var(--sf2)}
.bdg{position:absolute;top:3px;right:3px;background:var(--ac);color:#fff;border-radius:99px;font-size:10px;min-width:16px;height:16px;line-height:16px;text-align:center}
.mb,#nv .mb{display:none}
#sr{border-top:1px solid var(--bd);padding:8px 0}#sr input{width:100%}
main{padding-top:20px;padding-bottom:56px}
.hero{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:22px 24px;background:var(--sf);border:1px solid var(--bd);border-radius:10px}
.hero h1{margin:0;font:700 clamp(30px,8vw,44px)/1.1 Cinzel,Georgia,serif;color:var(--mint);text-shadow:2px 1px 0 var(--pink)}
.hero p{margin:6px 0 16px;color:var(--mu)}
.art{width:190px;height:auto;flex:none}
.note{font-size:13px;color:var(--mu);margin:10px 0 0}
.cols{display:grid;gap:24px;margin-top:20px;grid-template-columns:minmax(0,1fr)}
@media(min-width:900px){.cols{grid-template-columns:minmax(0,1fr) 310px}}
.blk{margin-bottom:24px}
.bh{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.bh h2,h2.t{margin:0;font-size:16px;font-weight:600}
.more{background:none;border:0;color:var(--mu);cursor:pointer;display:flex;align-items:center;gap:2px;font-size:13px}.more:hover{color:var(--tx)}
.bl{background:var(--sf);border:1px solid var(--bd);border-radius:10px;overflow:hidden}
.bl>*+*{border-top:1px solid var(--bd)}
.pg{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.pg>.pr{background:var(--sf);border:1px solid var(--bd);border-radius:10px}
.tr,.ir,.nr,.pr{display:grid;gap:12px;padding:12px 14px;cursor:pointer;align-items:center;min-width:0}
.tr:hover,.ir:hover,.nr:hover,.pr:hover{background:var(--sf2)}
.tr{grid-template-columns:34px minmax(0,1fr) 62px 150px}
.ir{grid-template-columns:34px minmax(0,1fr);align-items:start}
.nr{grid-template-columns:52px minmax(0,1fr)}
.pr{grid-template-columns:36px minmax(0,1fr);align-items:start}
.th{display:grid;grid-template-columns:34px minmax(0,1fr) 62px 150px;gap:12px;padding:0 14px 6px;font-size:12px;color:var(--mu)}
.tt{font-weight:600;line-height:1.3;overflow-wrap:anywhere;display:flex;gap:6px;align-items:flex-start}
.tg{display:flex;gap:6px 10px;flex-wrap:wrap;font-size:12.5px;color:var(--mu);margin-top:3px;align-items:center}
.ex{margin:2px 0 0;color:var(--mu);font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.tl{font-size:12.5px;color:var(--mu);display:grid;gap:2px}.tl span,.ct{display:inline-flex;align-items:center;gap:4px}
.tx{font-size:12.5px;color:var(--mu);min-width:0}.tx b{color:var(--tx);font-weight:500}
.nd{font-size:12px;color:var(--mu);line-height:1.2}
.cat{color:var(--tx);background:var(--sf2);border:1px solid var(--bd);border-radius:5px;padding:0 6px;font-size:12px}
.demo{border:1px dashed var(--mu);border-radius:5px;padding:0 6px;font-size:11.5px}
.st::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--mu);margin-right:5px}
.s1::before{background:#5aa8f0}.s2::before{background:var(--ac)}.s3::before{background:var(--ok)}.s4::before{background:var(--er)}
.av{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:8px;font-weight:600;font-size:14px;color:#fff;flex:none}
.av.s{width:20px;height:20px;border-radius:5px;font-size:11px}.av.l{width:72px;height:72px;font-size:30px;border-radius:14px}
.lk{cursor:pointer;background:none;border:0;padding:0;color:var(--mu);display:inline-flex;align-items:center;gap:4px;font-size:12.5px}.lk:hover,.lk.on{color:var(--ac2)}.lk.on svg{fill:currentColor}
.au{cursor:pointer;color:var(--tx)}.au:hover{color:var(--ac2)}
.btn{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:9px 16px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--ac2)}.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.g{background:none;border:1px solid var(--bd);color:var(--tx)}.btn.g:hover{background:var(--sf2)}
.ph{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.ph h1{margin:0;font-size:24px}
.tb{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.chips{display:flex;gap:6px;overflow-x:auto;max-width:100%;scrollbar-width:none;margin-bottom:10px}
.chip{background:none;border:1px solid var(--bd);border-radius:6px;padding:4px 11px;cursor:pointer;font-size:13.5px;white-space:nowrap;color:var(--mu);flex:none}
.chip.on{background:var(--sf2);color:var(--tx);border-color:var(--ac)}
select,input,textarea{background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:8px 11px;max-width:100%;min-width:0}
input:focus,textarea:focus,select:focus,button:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
.ov{position:fixed;inset:0;background:#000b;z-index:50;display:flex;justify-content:center;padding:16px 10px;overflow-y:auto}
.md{background:var(--sf);border:1px solid var(--bd);border-radius:12px;max-width:620px;width:100%;padding:18px;margin:auto;overflow-wrap:anywhere}
.md h3{margin:8px 0;font-size:21px;line-height:1.25}
.mh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.fm{display:grid;gap:10px}.fm label{display:grid;gap:4px;font-size:13px;color:var(--mu)}
.rw{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cm{border-top:1px solid var(--bd);padding:10px 0;font-size:14.5px}
.pb{height:5px;border-radius:9px;background:var(--bd);overflow:hidden}.pb i{display:block;height:100%;width:0;transition:width .2s}
.hint{font-size:13px;color:var(--mu);min-height:18px}.er{color:var(--er)}.okc{color:var(--ok)}
.pw{display:flex;gap:6px}.pw input{flex:1}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--sf2);border:1px solid var(--ac);padding:9px 16px;border-radius:8px;z-index:99;max-width:90%;font-size:14px}
.empty{text-align:center;color:var(--mu);padding:34px 14px}
.box{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:16px}
.stt{display:flex;gap:20px;color:var(--mu);font-size:13px;margin:10px 0}.stt b{display:block;color:var(--tx);font-size:18px}
footer{border-top:1px solid var(--bd);padding:16px 0;color:var(--mu);font-size:13px}
@media(max-width:859px){
nav{display:none;position:absolute;top:100%;left:-16px;right:-16px;flex-direction:column;align-items:stretch;background:var(--bg);border-bottom:1px solid var(--bd);padding:8px 16px}
nav.open{display:flex}nav button{text-align:left;padding:11px 8px}
.mb{display:inline-flex}#nv .mb{display:block}.dk{display:none}
.art{display:none}.tr{grid-template-columns:34px minmax(0,1fr) auto}.tx,.th{display:none}.tl{grid-auto-flow:column;gap:10px}
.hero{padding:18px 16px}}
@media(max-width:400px){.wrap{padding:0 12px}.logo{font-size:19px}.tr{gap:10px;padding:11px 12px}}

:root{--bg:#06060b;--sf:#0d0d16;--sf2:#151525;--bd:#22223a;--tx:#ebebf7;--mu:#8a8aab;--ac:#a35cff;--ac2:#c39bff;--bl:#3d8bff}
body{background:#06060b}a{color:var(--bl)}
header{background:#06060bee;backdrop-filter:blur(8px);box-shadow:0 1px 20px -10px var(--ac)}
.btn{background:var(--ac);box-shadow:0 0 0 1px #c39bff55,0 0 18px -5px var(--ac);transition:box-shadow .2s,background .2s}
.btn:hover{background:var(--ac2);box-shadow:0 0 26px -3px var(--ac)}.btn.g{box-shadow:none;border-color:var(--bd)}.btn.g:hover{border-color:var(--ac);box-shadow:0 0 16px -6px var(--ac)}
.tr,.ir,.nr,.pr{transition:background .15s,box-shadow .15s}
.tr:hover,.ir:hover,.nr:hover,.pr:hover{background:var(--sf2);box-shadow:inset 2px 0 0 var(--ac)}
.hero,.auth{box-shadow:0 0 44px -24px var(--ac)}.hero{border-color:#2f2a52}
.chip{transition:.15s}.chip:hover{color:var(--tx);border-color:var(--ac)}.chip.on{border-color:var(--bl);box-shadow:0 0 14px -6px var(--bl)}
input:focus,textarea:focus,select:focus{outline:0;border-color:var(--bl);box-shadow:0 0 0 3px #3d8bff2a}
button:focus-visible{outline:2px solid var(--bl)}
.st.s1::before{background:var(--bl)}.lk:hover,.lk.on{color:var(--ac2)}
.empty b{display:block;color:var(--tx);font-size:16px;margin-bottom:2px}.empty p{margin:0 0 12px}
.gate{min-height:calc(100vh - 150px);display:grid;place-items:center}.auth{width:100%;max-width:420px;padding:24px}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--sf2);border:1px solid var(--bd);border-radius:10px;padding:3px;margin-bottom:12px}
.tabs button{background:none;border:0;padding:8px;border-radius:8px;color:var(--mu);cursor:pointer;font-weight:500}
.tabs button.on{background:var(--sf);color:var(--tx);box-shadow:inset 0 0 0 1px var(--ac),0 0 14px -5px var(--ac)}
.out nav,.out #i_s,.out #i_b,.out #ub,.out .mb,.out .dk,.out #sr{display:none!important}
@keyframes in{from{opacity:0;transform:translateY(6px)}}#app>*{animation:in .3s ease both}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.av{overflow:hidden}.av img{width:100%;height:100%;object-fit:cover;display:block}
.stt{flex-wrap:wrap}.cm{overflow-wrap:anywhere}textarea{resize:vertical}.tr .tt span{min-width:0}
@media(max-width:400px){nav{left:-12px;right:-12px}}
</style>
</head>
<body>
<header><div class="wrap"><div class="bar">
<div class="logo" data-a="nav" data-v="home">GlitchZone</div>
<nav id="nv"></nav><div class="sp"></div>
<button class="ib" data-a="search" aria-label="Поиск" id="i_s"></button>
<button class="ib" data-a="bell" aria-label="Уведомления" id="i_b"><span id="bd" class="bdg" hidden></span></button>
<button class="btn g dk" id="ub" data-a="prof"></button>
<button class="ib mb" data-a="menu" aria-label="Меню" id="i_m"></button>
</div><div id="sr" hidden><input id="gs" placeholder="Поиск по сайту" aria-label="Поиск"></div></div></header>
<main class="wrap" id="app"></main>
<footer class="wrap">GlitchZone Community. Данные хранятся только в вашем браузере.</footer>
<div id="md"></div><div id="ts"></div>
<script>
const $=s=>document.querySelector(s),K='gz-v3',now=Date.now(),H=n=>now-n*36e5;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hs=s=>{let h=5381;for(const c of s)h=(h*33^c.charCodeAt(0))>>>0;return h};
const P={search:'<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',bell:'<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>',sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',moon:'<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>',menu:'<path d="M4 6h16M4 12h16M4 18h16"/>',x:'<path d="M18 6 6 18M6 6l12 12"/>',heart:'<path d="M19 14c1.5-1.5 3-3.2 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.8 0-3 .5-4.5 2-1.5-1.5-2.7-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4 3 5.5l7 7Z"/>',msg:'<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',plus:'<path d="M5 12h14M12 5v14"/>',pin:'<path d="M12 17v5M9 10.8a2 2 0 0 1-1.1 1.8l-1.8.9A2 2 0 0 0 5 15.2V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.8a2 2 0 0 0-1.1-1.8l-1.8-.9A2 2 0 0 1 15 10.8V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"/>',eye:'<path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>',trash:'<path d="M3 6h18M19 6l-1 14H6L5 6M10 11v6M14 11v6M9 6V4h6v2"/>',chev:'<path d="m9 18 6-6-6-6"/>',link:'<path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/>',edit:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>',out:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>'};
const ic=(n,s=18)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[n]}</svg>`;
const KN={news:'Новость',article:'Статья',idea:'Идея',post:'Публикация',topic:'Тема',project:'Проект'};
const FC=['Идеи','Баги','Игры','Помощь','Обсуждения','Другое'],PC=['Игры','Сайты','Боты','Приложения','Прочее'],ST=['Новое','Запланировано','В работе','Готово','Отклонено'];
const HUE=[258,205,165,320,30,215],HN=['Фиолетовый','Синий','Бирюзовый','Розовый','Оранжевый','Графитовый'];
const NAV=[['home','Главная'],['forum','Форум'],['feed','Лента'],['articles','Статьи'],['ideas','Идеи'],['projects','Проекты'],['news','Новости']];
const CFG={forum:{k:'topic',n:'topic',cats:FC,st:1},feed:{n:'post',kinds:1},articles:{k:'article',n:'article'},ideas:{k:'idea',n:'idea',st:1},projects:{k:'project',n:'project',cats:PC},news:{k:'news',n:'news'},search:{}};
const T={forum:'Форум',feed:'Лента',articles:'Статьи',ideas:'Идеи',projects:'Проекты',news:'Новости',search:'Результаты поиска'};
let id=0;try{['gz-demo-v1','gz-demo-v2'].forEach(k=>localStorage.removeItem(k))}catch(e){}
const seed=()=>({me:null,users:[],notifs:[],items:[]});
let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
if(!S||!S.items)S=seed();id=Math.max(0,...S.items.map(i=>i.id));
const sv=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
let page='home',F={cat:'',sort:'new',q:'',kind:'',st:''},view=null;
const U=n=>S.users.find(u=>u.n==n)||{n,role:'Участник',bio:'',j:Date.now()};
const dt=d=>new Date(d).toLocaleDateString('ru-RU',{day:'numeric',month:'short',year:'numeric'});
const ago=d=>{const m=(Date.now()-d)/6e4;return m<2?'только что':m<60?Math.floor(m)+' мин назад':m<1440?Math.floor(m/60)+' ч назад':dt(d)};
const av=(n,c='')=>{const u=U(n),h=HUE[u.col!=null?u.col:hs(n)%5];return u.img?`<span class="av ${c}"><img src="${esc(u.img)}" alt=""></span>`:`<span class="av ${c}" style="background:hsl(${h} ${u.col==5?'8%':'34%'} 38%)">${esc(n[0].toUpperCase())}</span>`};
const au=n=>`<span class="au" data-a="user" data-v="${esc(n)}">${esc(n)}</span>`;
const stt=i=>i.st?`<span class="st s${ST.indexOf(i.st)}">${esc(i.st)}</span>`:'';
const dm=i=>i.demo?'<span class="demo">Пример</span>':'';
const lm=i=>i.c.length?i.c[i.c.length-1]:{a:i.a,d:i.d};
function toast(m){const e=document.createElement('div');e.className='toast';e.textContent=m;$('#ts').append(e);setTimeout(()=>e.remove(),2600)}
function go(p){F={cat:'',sort:'new',q:'',kind:'',st:''};view=null;location.hash=p}
const lkb=i=>{const o=S.me&&i.l.includes(S.me);return `<button class="lk ${o?'on':''}" data-a="like" data-v="${i.id}" aria-label="Нравится">${ic('heart',14)}${i.l.length}</button>`};
const trow=i=>{const l=lm(i);return `<div class="tr" data-a="open" data-v="${i.id}">${av(i.a)}<div><div class="tt">${i.pin?ic('pin',14):''}<span>${esc(i.t)}</span></div><div class="tg"><span class="cat">${esc(i.cat||'')}</span>${stt(i)}<span>${au(i.a)}, ${ago(i.d)}</span>${dm(i)}</div></div><div class="tl"><span>${ic('msg',14)}${i.c.length}</span><span>${ic('heart',14)}${i.l.length}</span></div><div class="tx"><b>${esc(l.a)}</b><br>${ago(l.d)}</div></div>`};
const irow=i=>`<div class="ir" data-a="open" data-v="${i.id}">${av(i.a)}<div><div class="tt">${esc(i.t)}</div><p class="ex">${esc(i.b)}</p><div class="tg"><span class="cat">${i.cat&&i.k!='topic'?esc(i.cat):KN[i.k]}</span>${stt(i)}<span>${au(i.a)}, ${ago(i.d)}</span>${lkb(i)}<span class="ct">${ic('msg',14)}${i.c.length}</span>${dm(i)}</div></div></div>`;
const nrow=i=>`<div class="nr" data-a="open" data-v="${i.id}"><div class="nd">${new Date(i.d).toLocaleDateString('ru-RU',{day:'numeric',month:'short'})}</div><div><div class="tt">${esc(i.t)}</div>${i.demo?'<div class="tg">'+dm(i)+'</div>':''}</div></div>`;
const prow=(i,f)=>`<div class="pr" data-a="open" data-v="${i.id}"><span class="av" style="background:hsl(${HUE[hs(i.t)%5]} 34% 38%)">${esc(i.t[0])}</span><div><div class="tt">${esc(i.t)}</div>${f?`<p class="ex">${esc(i.b)}</p>`:''}<div class="tg"><span class="cat">${esc(i.cat)}</span>${stt(i)}<span>${au(i.a)}</span>${lkb(i)}${dm(i)}</div></div></div>`;
const blk=(t,p,h,e)=>`<section class="blk"><div class="bh"><h2>${t}</h2><button class="more" data-a="nav" data-v="${p}">Все${ic('chev',14)}</button></div><div class="bl">${h||`<div class="empty"><b>${e[0]}</b><p>${e[1]}</p><button class="btn" data-a="new" data-v="${e[2]}">${ic('plus',16)}${e[3]}</button></div>`}</div></section>`;

case'upd':{const i=find();if(!i||i.a!=S.me)break;const r=rd();if(!r)break;i.t=r.t;i.b=r.b;if($('#f_c'))i.cat=$('#f_c').value;if($('#f_s'))i.st=$('#f_s').value;if(i.k=='project')i.link=r.l;i.ed=Date.now();sv();draw();modal(detail(i));toast('Изменения сохранены');break}
case'bell':{const m=S.notifs.filter(n=>n.to==S.me);modal(`<div class="mh"><h3 style="margin:0">Уведомления</h3>${xb}</div>${m.map(n=>`<div class="cm" style="cursor:pointer;${n.r?'opacity:.55':''}" data-a="ntf" data-v="${n.i||0}" data-x="${n.d}">${esc(n.t)}<div class="hint">${ago(n.d)}</div></div>`).join('')||'<div class="empty"><b>Пока здесь тихо</b><p>Уведомления появятся, когда кто-то ответит или оценит твою запись.</p></div>'}${m.length?'<div class="rw" style="margin-top:10px"><button class="btn" data-a="readall">Прочитать все</button></div>':''}`);break}
case'ntf':{const n=S.notifs.find(x=>x.d==el.dataset.x);if(n)n.r=1;sv();const i=find();draw();if(i)modal(detail(i));else $('#md').innerHTML='';break}
case'readall':S.notifs.forEach(n=>{if(n.to==S.me||n.to=='*')n.r=1});sv();$('#md').innerHTML='';draw();break;
case'eye':{const p=$('#a_p');p.type=p.type=='password'?'text':'password';break}
case'reg':doReg();break;
case'login':doLogin();break;
case'logout':S.me=null;sv();toast('Вы вышли');go('home');break;
case'editp':{const u=U(S.me),c=u.col!=null?u.col:hs(S.me)%5;pend=undefined;modal(`<div class="mh"><h3 style="margin:0">Редактировать профиль</h3>${xb}</div><div class="fm" style="margin-top:12px"><div class="rw" style="gap:14px"><span id="av_pv">${av(S.me,'l')}</span><div class="rw"><button class="btn g" data-a="avpick">Загрузить фото</button>${u.img?'<button class="btn g" data-a="avrm">Убрать фото</button>':''}</div></div><input id="av_f" type="file" accept="image/png,image/jpeg,image/webp" hidden><div class="hint" id="av_h">PNG, JPG или WebP до 2 МБ.</div>
<label>Никнейм<input id="e_n" maxlength="16" value="${esc(S.me)}"></label><label>Цвет аватара (если нет фото)<select id="e_a">${HN.map((x,j)=>`<option value="${j}" ${j==c?'selected':''}>${x}</option>`).join('')}</select></label><label>О себе (до 160 символов)<textarea id="e_b" rows="3" maxlength="160">${esc(u.bio)}</textarea></label><div class="hint er" id="e_e"></div><div class="rw"><button class="btn" data-a="savep">Сохранить</button><button class="btn g" data-a="close">Отмена</button></div></div>`);break}
case'avpick':$('#av_f').click();break;
case'avrm':pend=null;$('#av_pv').innerHTML='<span class="av l" style="background:var(--sf2)"></span>';$('#av_h').textContent='Фото будет удалено после сохранения.';break;
case'savep':{const u=U(S.me),n=$('#e_n').value.trim(),e=$('#e_e'),o=S.me;
if(!/^[A-Za-z0-9_]{3,16}$/.test(n)){e.textContent='Ник: 3–16 символов, латиница, цифры и _';break}
if(n.toLowerCase()!=o.toLowerCase()&&S.users.some(x=>x.n.toLowerCase()==n.toLowerCase())){e.textContent='Этот ник уже занят';break}
u.col=+$('#e_a').value;u.bio=$('#e_b').value.trim();if(pend!==undefined){if(pend)u.img=pend;else delete u.img}pend=undefined;
if(n!=o){u.n=n;S.items.forEach(i=>{if(i.a==o)i.a=n;i.l=i.l.map(x=>x==o?n:x);i.c.forEach(c=>{if(c.a==o)c.a=n})});S.notifs.forEach(x=>{if(x.to==o)x.to=n});S.me=n;if(view==o)view=n}
sv();$('#md').innerHTML='';draw();toast('Профиль сохранён');break}
}});
document.addEventListener('input',e=>{const t=e.target;
if(t.id=='gs'){F.q=t.value;if(page!='search'){F.sort='new';location.hash='search'}else fill()}
else if(t.id=='lq'){F.q=t.value;fill()}
else if(['a_n','a_p','a_r'].includes(t.id)&&$('#bar'))chk()});
document.addEventListener('change',e=>{if(e.target.id=='av_f'){avUpload(e.target);return}const a=e.target.dataset.a;if(a=='sort'){F.sort=e.target.value;fill()}if(a=='st'){F.st=e.target.value;fill()}});
document.addEventListener('keydown',e=>{if(e.key=='Escape'){$('#md').innerHTML='';$('#sr').hidden=true}});
document.addEventListener('keydown',e=>{if(e.key=='Enter'&&['a_n','a_p','a_r'].includes(e.target.id)){const b=$('#a_b');if(b&&!b.disabled)b.click()}});
addEventListener('hashchange',()=>{draw();scrollTo(0,0)});
draw();
</script>
</body>
</html>
