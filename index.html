function pwModal(){modal(`<div class="mh"><h3 style="margin:0">Новый пароль</h3></div><div class="fm" style="margin-top:12px"><label>Новый пароль<input id="n_p" type="password" autocomplete="new-password"></label><div class="hint">От 8 символов, строчные и заглавные буквы, цифра или символ.</div><div class="hint er" id="n_e"></div><button class="btn" data-a="setpw">Сохранить пароль</button></div>`)}
function detail(i){return i.k=='project'?detail0(i).split('<h2 class="t"')[0]:detail0(i)}
function need(){if(S.me)return 1;toast('Сначала войдите или зарегистрируйтесь');$('#md').innerHTML='';go('login');return 0}
function notify(to,t,i){S.notifs.unshift({to,t,i,d:Date.now(),r:0})}
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;const a=el.dataset.a,v=el.dataset.v;
if(a=='close'){if(el.classList.contains('ov')&&e.target!=el)return;$('#md').innerHTML='';return}
const find=()=>S.items.find(i=>i.id==v);
switch(a){
case'nav':go(v);break;case'menu':$('#nv').classList.toggle('open');break;
case'search':{const s=$('#sr');s.hidden=!s.hidden;if(!s.hidden)$('#gs').focus();break}
case'prof':go(S.me?'profile':'login');break;
case'user':$('#md').innerHTML='';view=v;location.hash='profile';draw();break;
case'f':F[el.dataset.k]=v;draw();break;
case'open':modal(detail(find()));break;
case'like':{e.stopPropagation();if(!need())break;const i=find();if(!i||!PCAT[i.k])break;run(async()=>{if(i.l.includes(S.me))ck(await sb.from('likes').delete().eq('post_id',i.id).eq('user_id',S.uid));else ck(await sb.from('likes').insert({post_id:i.id}));await load();draw();if(el.dataset.m)modal(detail(find()))});break}
case'cmt':{if(!need())break;const i=find(),t=$('#cmt').value.trim();if(!t){toast('Напишите текст');break}run(async()=>{ck(await(i.k=='topic'?sb.from('forum_replies').insert({topic_id:i.id,content:t}):sb.from('comments').insert({post_id:i.id,content:t})));await load();draw();modal(detail(find()))});break}
case'cdel':{const i=find(),c=i&&i.c[+el.dataset.x];if(!c||c.a!=S.me)break;run(async()=>{ck(await sb.from(i.k=='topic'?'forum_replies':'comments').delete().eq('id',c.id));await load();draw();modal(detail(find()))});break}
case'del':modal(`<h3>Удалить запись?</h3><p class="hint">Вместе с ней удалятся комментарии. Действие нельзя отменить.</p><div class="rw"><button class="btn" data-a="delok" data-v="${v}">Удалить</button><button class="btn g" data-a="close">Отмена</button></div>`);break;
case'delok':{const i=find();if(!i||i.a!=S.me)break;run(async()=>{ck(await sb.from(TB[i.k]).delete().eq('id',i.id));await load();$('#md').innerHTML='';draw()},'Запись удалена');break}
case'new':{if(!need())break;const k=v;modal(`<div class="mh"><h3 style="margin:0">Новая запись: ${KN[k].toLowerCase()}</h3>${xb}</div><div class="fm" style="margin-top:12px">${form(k)}<div class="rw"><button class="btn" data-a="save" data-v="${k}">Опубликовать</button><button class="btn g" data-a="close">Отмена</button></div></div>`);break}
case'save':{const r=rd();if(!r)break;const k=v,c=$('#f_c')?$('#f_c').value:'';run(async()=>{let row;
 if(k=='topic')row=ck(await sb.from('forum_topics').insert({title:r.t,content:r.b,category:TCAT[c]}).select('id').single());
 else if(k=='project')row=ck(await sb.from('projects').insert({title:r.t,description:r.b,category:JCAT[c],url:r.l||null}).select('id').single());
 else row=ck(await sb.from('posts').insert({title:r.t,content:r.b,category:PCAT[k]}).select('id').single());
 await load();draw();const n=S.items.find(x=>x.id==row.id);if(n)modal(detail(n));toast('Опубликовано')});break}
case'edit':{const i=find();if(!i||i.a!=S.me)break;modal(`<div class="mh"><h3 style="margin:0">Редактирование</h3>${xb}</div><div class="fm" style="margin-top:12px">${form(i.k,i)}<div class="rw"><button class="btn" data-a="upd" data-v="${i.id}">Сохранить</button><button class="btn g" data-a="open" data-v="${i.id}">Отмена</button></div></div>`);break}
case'upd':{const i=find();if(!i||i.a!=S.me)break;const r=rd();if(!r)break;const c=$('#f_c')?$('#f_c').value:'';run(async()=>{let u;
 if(i.k=='topic')u={title:r.t,content:r.b,category:TCAT[c]};else if(i.k=='project')u={title:r.t,description:r.b,category:JCAT[c],url:r.l||null};else u={title:r.t,content:r.b};
 ck(await sb.from(TB[i.k]).update(u).eq('id',i.id));await load();draw();modal(detail(find()))},'Изменения сохранены');break}
case'bell':{modal(`<div class="mh"><h3 style="margin:0">Уведомления</h3>${xb}</div>${S.notifs.map(n=>`<div class="cm" style="cursor:pointer;${n.r?'opacity:.55':''}" data-a="ntf" data-v="${n.i||0}" data-x="${n.id}">${esc(n.t)}<div class="hint">${ago(n.d)}</div></div>`).join('')||'<div class="empty"><b>Пока здесь тихо</b><p>Уведомления появятся, когда кто-то ответит или оценит твою запись.</p></div>'}${S.notifs.length?'<div class="rw" style="margin-top:10px"><button class="btn" data-a="readall">Прочитать все</button></div>':''}`);break}
case'ntf':{const n=S.notifs.find(x=>x.id==el.dataset.x);if(n&&!n.r){n.r=true;sb.from('notifications').update({is_read:true}).eq('id',n.id).then(()=>{})}const i=find();draw();if(i)modal(detail(i));else $('#md').innerHTML='';break}
case'readall':run(async()=>{ck(await sb.from('notifications').update({is_read:true}).eq('user_id',S.uid).eq('is_read',false));S.notifs.forEach(n=>n.r=true);$('#md').innerHTML='';draw()});break;
case'eye':{const p=$('#a_p');p.type=p.type=='password'?'text':'password';break}
case'reg':doReg();break;
case'login':doLogin();break;
case'forgot':modal(`<div class="mh"><h3 style="margin:0">Сброс пароля</h3>${xb}</div><div class="fm" style="margin-top:12px"><label>Почта<input id="r_e" type="email"></label><div class="hint er" id="r_h"></div><button class="btn" data-a="sendreset">Отправить письмо</button></div>`);break;
case'sendreset':{const m=$('#r_e').value.trim();if(!/^\S+@\S+\.\S+$/.test(m)){$('#r_h').textContent='Введите корректную почту';break}run(async()=>{await sb.auth.resetPasswordForEmail(m,{redirectTo:location.href.split('#')[0].split('?')[0]});$('#md').innerHTML='';toast('Если такой адрес зарегистрирован, письмо отправлено')});break}
case'setpw':{const p=$('#n_p').value;if(p.length<8||sc(p)<3){$('#n_e').textContent='Пароль слишком простой';break}run(async()=>{const {error}=await sb.auth.updateUser({password:p});if(error){$('#n_e').textContent=error.message;return}$('#md').innerHTML='';toast('Пароль изменён')});break}
case'logout':run(async()=>{await sb.auth.signOut();S.uid=null;S.me=null;S.items=[];S.notifs=[];toast('Вы вышли');go('home');draw()});break;
case'editp':{const u=U(S.me);modal(`<div class="mh"><h3 style="margin:0">Редактировать профиль</h3>${xb}</div><div class="fm" style="margin-top:12px"><div class="rw" style="gap:14px">${av(S.me,'l')}<div class="hint" style="flex:1;min-width:160px">Аватар задаётся ссылкой. Загрузка файлов появится после настройки Supabase Storage.</div></div><label>Ссылка на аватар (https://…)<input id="e_u" maxlength="500" value="${esc(u.img||'')}"></label><label>Никнейм<input id="e_n" maxlength="16" value="${esc(S.me)}"></label><label>О себе (до 160 символов)<textarea id="e_b" rows="3" maxlength="160">${esc(u.bio)}</textarea></label><div class="hint er" id="e_e"></div><div class="rw"><button class="btn" data-a="savep">Сохранить</button><button class="btn g" data-a="close">Отмена</button></div></div>`);break}
case'savep':{const n=$('#e_n').value.trim(),e=$('#e_e'),url=$('#e_u').value.trim();
if(!/^[A-Za-z0-9_]{3,16}$/.test(n)){e.textContent='Ник: 3–16 символов, латиница, цифры и _';break}
if(url&&!/^https:\/\/\S+$/.test(url)){e.textContent='Ссылка на аватар должна начинаться с https://';break}
run(async()=>{const {error}=await sb.from('profiles').update({username:n,bio:$('#e_b').value.trim(),avatar_url:url||null}).eq('id',S.uid);if(error){e.textContent=error.code=='23505'?'Этот ник уже занят':error.message;return}await load();$('#md').innerHTML='';draw();toast('Профиль сохранён')});break}
case'savecfg':{const u=$('#s_u').value.trim(),k=$('#s_k').value.trim(),e=$('#s_e');let bad=/^sb_secret_/.test(k);try{if(k.startsWith('eyJ'))bad=JSON.parse(atob(k.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'))).role=='service_role'}catch(x){}
if(!/^https:\/\/[a-z0-9-]+\.supabase\.co\/?$/.test(u)){e.textContent='Адрес должен выглядеть как https://xxxx.supabase.co';break}
if(bad){e.textContent='Это секретный ключ. Нужен публичный (anon / publishable).';break}
if(k.length<20){e.textContent='Вставьте ключ целиком';break}
try{localStorage.setItem('gz-cfg',JSON.stringify({url:u.replace(/\/$/,''),key:k}))}catch(x){}location.reload();break}
}});
document.addEventListener('input',e=>{const t=e.target;
if(t.id=='gs'){F.q=t.value;if(page!='search'){F.sort='new';location.hash='search'}else fill()}
else if(t.id=='lq'){F.q=t.value;fill()}
else if(['a_n','a_e','a_p','a_r'].includes(t.id)&&$('#bar'))chk()});
document.addEventListener('change',e=>{const a=e.target.dataset.a;if(a=='sort'){F.sort=e.target.value;fill()}if(a=='st'){F.st=e.target.value;fill()}});
document.addEventListener('keydown',e=>{if(e.key=='Escape'){$('#md').innerHTML='';$('#sr').hidden=true}});
document.addEventListener('keydown',e=>{if(e.key=='Enter'&&['a_n','a_e','a_p','a_r'].includes(e.target.id)){const b=$('#a_b');if(b&&!b.disabled)b.click()}});
addEventListener('hashchange',()=>{draw();scrollTo(0,0)});
if(sb)init();else draw();
</script>
</body>
</html>
